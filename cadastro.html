<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cadastro | Lume</title><link rel="stylesheet" href="login.css"></head><body class="auth-page"><main class="auth-container"><section class="auth-card"><a class="brand" href="home.html"><span class="brand-mark">L</span><span>Lume</span></a><div class="auth-heading"><span class="eyebrow">Faça parte do Lume</span><h1>Criar uma conta</h1><p>Escolha seu perfil e cadastre seus dados para continuar.</p></div><form id="cadastroForm" novalidate><div class="field"><label for="userType">Quero me cadastrar como</label><select id="userType"><option value="">Selecione uma opção</option><option value="usuario">Usuário</option><option value="voluntario">Voluntário</option></select><small class="error" id="userTypeError"></small></div><div class="field"><label for="cadastroEmail">E-mail</label><input id="cadastroEmail" type="email" placeholder="exemplo@email.com" autocomplete="email"><small class="error" id="cadastroEmailError"></small></div><div class="field"><label for="cadastroPassword">Senha</label><div class="password-wrapper"><input id="cadastroPassword" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password"><button type="button" class="password-toggle" data-target="cadastroPassword">Mostrar</button></div><small class="error" id="cadastroPasswordError"></small></div><div class="field"><label for="confirmPassword">Confirmar senha</label><div class="password-wrapper"><input id="confirmPassword" type="password" placeholder="Digite a senha novamente" autocomplete="new-password"><button type="button" class="password-toggle" data-target="confirmPassword">Mostrar</button></div><small class="error" id="confirmPasswordError"></small></div><p class="form-message" id="cadastroMessage"></p><button class="primary-button" type="submit">Criar conta</button></form><p class="switch-auth">Já tenho uma conta? <a href="login.html">Voltar para o Login</a></p><a class="home-link" href="home.html">← Voltar ao início do Lume</a></section></main><script src="login.js"></script></body></html>
