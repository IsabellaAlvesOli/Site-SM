<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Entrar | Lume</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card">
            <a class="brand" href="../home.html">
                <span class="brand-mark">L</span>
                <span>Lume</span>
            </a>

            <div class="auth-heading">
                <span class="eyebrow">Bem-vindo(a) de volta</span>
                <h1>Entrar na sua conta</h1>
                <p>Acesse sua conta para continuar no Lume.</p>
            </div>

            <form id="loginForm" onsubmit="return fazerLogin(this)">
                <div class="field">
                    <label for="loginEmail">E-mail</label>
                    <input
                        id="loginEmail"
                        name="loginEmail"
                        type="email"
                        placeholder="exemplo@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <div class="label-row">
                        <label for="loginPassword">Senha</label>
                        <a href="#"
                           onclick="alert('A recuperação de senha é apenas demonstrativa neste projeto.'); return false;">
                            Esqueci minha senha
                        </a>
                    </div>

                    <div class="password-wrapper">
                        <input
                            type="checkbox"
                            id="showLoginPassword"
                            class="password-check"
                        >
                        <label for="showLoginPassword" class="password-toggle">
                            Mostrar
                        </label>

                        <input
                            id="loginPassword"
                            name="loginPassword"
                            type="text"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >
                    </div>
                </div>

                <button class="primary-button" type="submit">
                    Entrar
                </button>
            </form>

            <p class="switch-auth">
                Ainda não tenho uma conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

            <a class="home-link" href="../home.html">
                ← Voltar ao início do Lume
            </a>
        </section>
    </main>

    <script src="../js/login.js"></script>
</body>

</html>
